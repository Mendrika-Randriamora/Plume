name: Release

# Se déclenche à chaque push sur main (donc à chaque merge de PR)
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ matrix.platform }}${{ matrix.target && format(' / {0}', matrix.target) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # .deb, .rpm, .AppImage
          - platform: ubuntu-22.04
            target: ""
            bundles: deb,rpm,appimage
          # .msi + .exe (installeur NSIS)
          - platform: windows-latest
            target: ""
            bundles: nsis,msi
          # .dmg Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          # .dmg Intel (compilation croisée depuis un runner arm64)
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dépendances Linux (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Ajouter la cible Rust (macOS)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Installer les dépendances frontend
        run: npm ci

      - name: Build + Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des mises à jour : génère les .sig et le latest.json de la release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # __VERSION__ est remplacé automatiquement par la version de tauri.conf.json
          tagName: v__VERSION__
          releaseName: "Release v__VERSION__"
          releaseBody: "See the assets below to download the installer for your platform (.deb/.rpm/.AppImage on Linux, .msi/.exe on Windows, .dmg on macOS)."
          releaseDraft: false
          prerelease: false
          # Publie latest.json (le fichier lu par le plugin updater) dans la release.
          # Nécessite les .sig, donc TAURI_SIGNING_PRIVATE_KEY(_PASSWORD).
          includeUpdaterJson: true
          # --bundles force les formats attendus par plateforme (le .exe = NSIS, le .dmg = macOS)
          args: ${{ matrix.target != '' && format('--target {0} --bundles {1}', matrix.target, matrix.bundles) || format('--bundles {0}', matrix.bundles) }}
